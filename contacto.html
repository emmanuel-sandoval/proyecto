<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="estilos.css">

<body>

  <header>
    <nav>
      <a href="index.html" class="logo">MiSitio</a>
      <ul class="menu">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="contacto.html" class="activo">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contacto</h1>
    <p>Completa el siguiente formulario para ponerte en contacto con nosotros.</p>

    <div class="tarjeta">
      <form action="#" method="post">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>

        <div>
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
        </div>

        <div>
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MiSitio. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
